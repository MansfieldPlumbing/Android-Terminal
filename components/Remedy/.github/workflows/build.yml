name: Canonical Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-build:
    name: Windows 2022 / MSVC
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize MSVC and run canonical build
        shell: cmd
        run: |
          @echo on
          set "VSINSTALL="

          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"

          if not defined VSINSTALL (
            echo ERROR: No Visual Studio installation with the x64 MSVC tools was found.
            exit /b 1
          )

          echo Visual Studio installation: %VSINSTALL%

          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 (
            echo ERROR: VsDevCmd.bat failed with exit code %ERRORLEVEL%.
            exit /b %ERRORLEVEL%
          )

          where cl.exe
          if errorlevel 1 exit /b 1

          where cmake.exe
          if errorlevel 1 exit /b 1

          where ctest.exe
          if errorlevel 1 exit /b 1

          if "%INCLUDE%"=="" (
            echo ERROR: INCLUDE is empty after VsDevCmd initialization.
            exit /b 1
          )

          if "%LIB%"=="" (
            echo ERROR: LIB is empty after VsDevCmd initialization.
            exit /b 1
          )

          cmake.exe --version
          if errorlevel 1 exit /b %ERRORLEVEL%

          ctest.exe --version
          if errorlevel 1 exit /b %ERRORLEVEL%

          cl.exe
          if errorlevel 2 exit /b %ERRORLEVEL%

          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\build.ps1" -Clean -Test
          exit /b %ERRORLEVEL%

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: remedy-canonical-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/**
            build/**/*.log
